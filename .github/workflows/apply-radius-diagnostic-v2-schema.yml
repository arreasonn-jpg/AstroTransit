name: Apply radius diagnostic v2 schema

on:
  push:
    branches: ["validation/tls-map-radius-n10-v2"]
    paths: [".github/workflows/apply-radius-diagnostic-v2-schema.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validation/tls-map-radius-n10-v2
          fetch-depth: 0
      - name: Add MAP boundary provenance to diagnostic rows
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("astrotransit/validation/radius_diagnostics.py")
          text = path.read_text(encoding="utf-8")
          replacements = [
              ('RADIUS_DIAGNOSTIC_SCHEMA_VERSION = "1.0"', 'RADIUS_DIAGNOSTIC_SCHEMA_VERSION = "1.1"'),
              (
                  '    fit_method: str\n    cascade_status: str\n',
                  '    fit_method: str\n'
                  '    fit_optimizer_boundary_hit: bool\n'
                  '    fit_optimizer_boundary_hits: tuple[str, ...]\n'
                  '    limb_darkening_parameterization: str\n'
                  '    cascade_status: str\n',
              ),
              (
                  '        fit_method=str(_get(fit, "fit_method", "") or ""),\n        cascade_status=cascade_status,\n',
                  '        fit_method=str(_get(fit, "fit_method", "") or ""),\n'
                  '        fit_optimizer_boundary_hit=bool(\n'
                  '            _get(fit, "optimizer_boundary_hit", False)\n'
                  '        ),\n'
                  '        fit_optimizer_boundary_hits=tuple(\n'
                  '            str(item) for item in (_get(fit, "optimizer_boundary_hits", ()) or ())\n'
                  '        ),\n'
                  '        limb_darkening_parameterization=str(\n'
                  '            _get(fit, "limb_darkening_parameterization", "") or ""\n'
                  '        ),\n'
                  '        cascade_status=cascade_status,\n',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one match, found {count}: {old[:80]!r}")
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Remove one-time schema workflow
        run: rm .github/workflows/apply-radius-diagnostic-v2-schema.yml
      - name: Commit diagnostic schema
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add astrotransit/validation/radius_diagnostics.py .github/workflows/apply-radius-diagnostic-v2-schema.yml
          git commit -m "validation: capture MAP boundary provenance"
          git push origin HEAD:validation/tls-map-radius-n10-v2
