name: Quiet host prescreen v1

on:
  workflow_dispatch:
    inputs:
      candidate_limit:
        description: Maximum deterministic candidates to screen
        required: true
        default: "60"
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: quiet-host-prescreen-v1
  cancel-in-progress: false

jobs:
  prescreen:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'validation/quiet-host-prescreen-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
      CANDIDATE_LIMIT: ${{ inputs.candidate_limit || '60' }}
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH_NAME }}
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install locked project environment
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Screen real TESS hosts
        id: screen
        shell: bash
        run: |
          set +e
          python scripts/validation/prescreen_quiet_hosts.py \
            --pool benchmarks/discovery_targets_v4_small_cool_200_dedup.csv \
            --labelled-corpus benchmarks/corpora/tfop_disposition_corpus_v1.json \
            --contract validation_runs/v1_injection_recovery/real_noise_v1/contract.json \
            --output-dir validation_runs/v1_injection_recovery/real_noise_v1/input \
            --candidate-limit "$CANDIDATE_LIMIT" \
            --required-hosts 10
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Freeze environment manifest
        if: steps.screen.outputs.exit_code == '0'
        run: |
          python scripts/maintenance/make_environment_manifest.py \
            --output validation_runs/v1_injection_recovery/real_noise_v1/environment_manifest.json \
            --config configs/default.toml
      - name: Upload prescreen evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quiet-host-prescreen-v1
          path: validation_runs/v1_injection_recovery/real_noise_v1/
      - name: Commit frozen host corpus and remove one-time workflow
        if: steps.screen.outputs.exit_code == '0'
        shell: bash
        run: |
          rm .github/workflows/quiet-host-prescreen-v1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation_runs/v1_injection_recovery/real_noise_v1 .github/workflows/quiet-host-prescreen-v1.yml
          git commit -m "validation: freeze real-TESS quiet host corpus"
          git push origin "HEAD:${BRANCH_NAME}"
      - name: Enforce ten-host result
        if: steps.screen.outputs.exit_code != '0'
        run: |
          echo "Quiet-host prescreen did not freeze ten hosts; inspect the uploaded audit artifact."
          exit 1
