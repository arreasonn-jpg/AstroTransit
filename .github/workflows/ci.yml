name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

jobs:
  quality:
    # Check-run names are stable on purpose: branch protection (required
    # status checks) selects "quality (Python 3.11)" etc. explicitly.
    name: quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Ruff
        # pyproject.toml'daki [tool.ruff.lint] ayarlarini kullanir.
        # scripts/ temizligi icin bkz. chore/ruff-scripts.
        run: ruff check astrotransit cli dashboard tests
      - name: Compile
        run: python -m compileall -q astrotransit cli dashboard
      - name: Pytest with coverage
        run: python -m pytest -q --cov=astrotransit --cov-report=term --cov-report=xml --cov-fail-under=52
      - name: CLI contract smoke tests
        run: |
          python -m cli.main --help
          python -m cli.main migrate --help
          python -m cli.main target-pool --help
          python -m cli.main version
      - name: Output schema contract check
        # Şema sürümü ve epistemik alanlar (fpp_method) sözleşmede kalmalı.
        run: |
          python - <<'PY'
          from astrotransit.outputs.schemas import SCHEMA_VERSION, TransitCandidateRecord
          from astrotransit.quality.vetting import FPP_METHOD
          assert SCHEMA_VERSION == "1.7"
          rec = TransitCandidateRecord(fpp_method=FPP_METHOD)
          flat = rec.to_flat_dict()
          assert flat["fpp_method"] == FPP_METHOD
          assert rec.to_nested_dict()["vetting"]["fpp_method"] == FPP_METHOD
          print("schema contract ok:", SCHEMA_VERSION)
          PY
      - name: Candidate JSON Schema validation
        run: |
          python - <<'PY'
          import json
          from jsonschema import Draft202012Validator
          from astrotransit.outputs.schemas import TransitCandidateRecord
          schema = json.load(open("docs/candidate.schema.json", encoding="utf-8"))
          instance = TransitCandidateRecord().to_nested_dict()
          errors = sorted(Draft202012Validator(schema).iter_errors(instance), key=lambda error: error.path)
          assert not errors, "\\n".join(error.message for error in errors)
          print("candidate schema contract ok")
          PY
      - name: FPP calibration cohort contract check
        # Kohort seçimi yalnızca dış katalog disposition'larından gelir ve
        # dondurulmuş hash ile birebir yeniden üretilmelidir; kapı sözleşmesi
        # ölçüm önceden ilan edilmiş check'lerden oluşur.
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, ".")
          from scripts.validation.run_fpp_calibration_campaign import (
              COHORT_MANIFEST, LABELLED_CORPUS, PRIOR_INJECTION_HOSTS, ROOT, select_cohorts,
          )
          payload, audit = select_cohorts(ROOT / LABELLED_CORPUS, ROOT / PRIOR_INJECTION_HOSTS)
          frozen = json.loads(Path(COHORT_MANIFEST).read_text(encoding="utf-8"))
          assert payload["status"] == "frozen"
          assert payload["selected_count"] == 200
          assert payload["selection"]["detector_used_for_selection"] is False
          assert audit["cohort_sha256"] == frozen["cohort_sha256"]
          program = json.loads(Path("validation_runs/final_acceptance_v1/program.json").read_text(encoding="utf-8"))
          gate = next(g for g in program["gates"] if g["id"] == "fpp_quality_calibration")
          assert gate["status"] == "pending_run"
          assert len(gate.get("acceptance_checks", [])) >= 13
          assert gate["required_output"].endswith("fpp_calibration/report.json")
          print("FPP calibration cohort contract ok:", audit["cohort_sha256"][:12])
          PY
      - name: Adversarial false-positive corpus contract check
        # Sentetik korpus yeniden üretilebilir olmalı ve program.json aynı grid
        # hash'ini + aynı tabanları ilan etmeli; ölçüm yapılmadan kapı kapatılamaz.
        run: python scripts/validation/run_adversarial_fp_controls.py check
      - name: Blind domain holdout corpus contract check
        # Holdout üyeliği yalnızca blind bölmeden ve önceki kapıların dışındaki
        # hedeflerden gelmeli; korpus ile kapı sözleşmesi birebir anlaşmalı.
        run: python scripts/validation/run_blind_holdout.py check
      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  modeling-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install optional modeling environment
        run: python -m pip install --upgrade pip && python -m pip install -e ".[modeling]"
      - name: Verify modeling imports and diagnostic contract
        run: |
          python - <<'PY'
          import arviz, exoplanet, pymc
          from astrotransit.modeling.pymc_fit import MCMCFitResult
          assert MCMCFitResult.__dataclass_fields__["convergence_ok"]
          print("modeling environment ok")
          PY

  platform-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and development tools
        shell: bash
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: CLI and compile smoke test
        shell: bash
        run: |
          python -m compileall -q astrotransit cli dashboard
          python -m cli.main version
          python -m cli.main release-gate --help
          python -m cli.main evaluate-corpus --help
          python -m cli.main evaluate-fpp --help

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build backend
        run: python -m pip install --upgrade pip build
      - name: Build sdist and wheel
        run: python -m build --sdist --wheel
      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package-build
          path: dist/*

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build image (locked requirements)
        run: docker build -t astrotransit:ci .
      - name: Smoke test CLI inside the image
        run: docker run --rm astrotransit:ci version

  type-check:
    name: mypy (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and dev tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run mypy
        run: mypy astrotransit cli dashboard
