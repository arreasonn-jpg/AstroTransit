name: Sharded N=10 TLS-MAP radius diagnostics

on:
  push:
    branches: ["validation/tls-map-radius-n10-v1"]
    paths: [".github/workflows/tls-map-radius-n10.yml"]

permissions:
  contents: write

concurrency:
  group: tls-map-radius-n10-v1
  cancel-in-progress: false

env:
  CAMPAIGN_ROOT: validation_runs/radius_diagnostics/tls_map_n10_v1

jobs:
  diagnostic-shards:
    name: radius diagnostic (${{ matrix.tic_id }})
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        tic_id:
          - "100100827"
          - "25155310"
          - "38846515"
          - "279741379"
          - "281541555"
          - "219338557"
          - "142090065"
          - "183985250"
          - "1003831"
          - "55315929"
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: validation/tls-map-radius-n10-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install locked environment and restore clean tree
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r envs/requirements.lock
          python -m pip install --no-deps -e .
          git reset --hard HEAD
          test -z "$(git status --porcelain)"

      - name: Prepare immutable target input
        env:
          TIC_ID: ${{ matrix.tic_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          tic_id = os.environ["TIC_ID"]
          source = json.loads(Path(
              "validation_runs/v1_known_planets/known_planets_10_v1/input/targets.json"
          ).read_text(encoding="utf-8"))
          selected = [row for row in source if str(row.get("tic_id")) == tic_id]
          if len(selected) != 1:
              raise SystemExit(f"Expected one frozen N=10 target for TIC {tic_id}")
          work = Path(f"/tmp/astrotransit_tls_map_n10_v1/{tic_id}")
          work.mkdir(parents=True, exist_ok=True)
          (work / "target.json").write_text(
              json.dumps(selected, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Capture clean shard environment
        env:
          TIC_ID: ${{ matrix.tic_id }}
        run: |
          WORK="/tmp/astrotransit_tls_map_n10_v1/$TIC_ID"
          python scripts/maintenance/make_environment_manifest.py \
            --config configs/default.toml \
            --output "$WORK/env_manifest.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          tic_id = os.environ["TIC_ID"]
          path = Path(f"/tmp/astrotransit_tls_map_n10_v1/{tic_id}/env_manifest.json")
          manifest = json.loads(path.read_text(encoding="utf-8"))
          if manifest.get("git", {}).get("dirty") is not False:
              raise SystemExit(f"Shard {tic_id} environment is not clean")
          PY

      - name: Run measured radius diagnostic shard
        env:
          TIC_ID: ${{ matrix.tic_id }}
        run: |
          SHARD="$CAMPAIGN_ROOT/shards/TIC-$TIC_ID"
          WORK="/tmp/astrotransit_tls_map_n10_v1/$TIC_ID"
          rm -rf "$SHARD"
          mkdir -p "$SHARD/environment" "$SHARD/input" "$SHARD/results"
          cp "$WORK/target.json" "$SHARD/input/target.json"
          cp "$WORK/env_manifest.json" "$SHARD/environment/env_manifest.json"
          python scripts/validation/run_radius_diagnostics.py \
            --targets "$WORK/target.json" \
            --output-dir "$SHARD/results"

      - name: Validate and manifest shard
        env:
          TIC_ID: ${{ matrix.tic_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from astrotransit.validation.provenance import canonical_hash, sha256_file

          tic_id = os.environ["TIC_ID"]
          root = Path(os.environ["CAMPAIGN_ROOT"]) / "shards" / f"TIC-{tic_id}"
          report = json.loads((root / "results/radius_diagnostics.json").read_text(encoding="utf-8"))
          rows = report.get("rows", [])
          expected_id = f"TIC {int(tic_id)}"
          if not rows:
              raise SystemExit(f"Shard {tic_id} produced no diagnostic rows")
          if any(row.get("target_id") != expected_id for row in rows):
              raise SystemExit(f"Shard {tic_id} contains another target")
          manifest = {
              "campaign": "tls_map_n10_v1",
              "tic_id": tic_id,
              "target_id": expected_id,
              "git_commit": json.loads(
                  (root / "environment/env_manifest.json").read_text(encoding="utf-8")
              ).get("git", {}).get("commit"),
              "canonical_output_hash": canonical_hash(report),
              "artifacts": {
                  str(path.relative_to(root)): sha256_file(path)
                  for path in sorted(root.rglob("*")) if path.is_file()
              },
          }
          (root / "manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Upload immutable shard
        uses: actions/upload-artifact@v4
        with:
          name: radius-diagnostic-shard-${{ matrix.tic_id }}
          path: ${{ env.CAMPAIGN_ROOT }}/shards/TIC-${{ matrix.tic_id }}
          if-no-files-found: error
          retention-days: 7

  aggregate:
    name: aggregate and freeze
    needs: diagnostic-shards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: validation/tls-map-radius-n10-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install locked aggregation environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r envs/requirements.lock
          python -m pip install --no-deps -e .
          git reset --hard HEAD

      - name: Download all shards
        uses: actions/download-artifact@v4
        with:
          pattern: radius-diagnostic-shard-*
          path: downloaded-shards

      - name: Assemble and aggregate campaign
        run: |
          rm -rf "$CAMPAIGN_ROOT"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from astrotransit.validation.radius_diagnostics import (
              RadiusDiagnosticReport,
              RadiusDiagnosticRow,
              write_radius_diagnostic_report,
          )

          selected_ids = [
              "100100827", "25155310", "38846515", "279741379", "281541555",
              "219338557", "142090065", "183985250", "1003831", "55315929",
          ]
          root = Path(os.environ["CAMPAIGN_ROOT"])
          root.mkdir(parents=True, exist_ok=True)
          frozen_input = Path(
              "validation_runs/v1_known_planets/known_planets_10_v1/input/targets.json"
          )
          (root / "input").mkdir(parents=True, exist_ok=True)
          (root / "input/targets.json").write_bytes(frozen_input.read_bytes())

          downloads = Path("downloaded-shards")
          artifacts = sorted(downloads.glob("radius-diagnostic-shard-*"))
          if len(artifacts) != 10:
              raise SystemExit(f"Expected 10 shards, got {len(artifacts)}")

          rows = []
          for tic_id in selected_ids:
              artifact = downloads / f"radius-diagnostic-shard-{tic_id}"
              destination = root / "shards" / f"TIC-{tic_id}"
              for source_path in artifact.rglob("*"):
                  if source_path.is_file():
                      target = destination / source_path.relative_to(artifact)
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(source_path.read_bytes())
              shard_report = json.loads(
                  (destination / "results/radius_diagnostics.json").read_text(encoding="utf-8")
              )
              rows.extend(RadiusDiagnosticRow(**row) for row in shard_report["rows"])

          report = RadiusDiagnosticReport(rows=rows)
          write_radius_diagnostic_report(report, root / "aggregate")
          PY

      - name: Validate aggregate and build manifest
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from astrotransit.validation.provenance import build_manifest, canonical_hash, sha256_file

          root = Path(os.environ["CAMPAIGN_ROOT"])
          report = json.loads((root / "aggregate/radius_diagnostics.json").read_text(encoding="utf-8"))
          corpus = json.loads((root / "input/targets.json").read_text(encoding="utf-8"))
          expected_ids = [f"TIC {int(row['tic_id'])}" for row in corpus]
          measured_ids = list(dict.fromkeys(row.get("target_id") for row in report.get("rows", [])))
          if measured_ids != expected_ids:
              raise SystemExit(f"Aggregate target order mismatch: {measured_ids}")
          if report.get("summary", {}).get("n_rows", 0) < 10:
              raise SystemExit("Aggregate has fewer than ten sector rows")

          env_paths = sorted(root.glob("shards/TIC-*/environment/env_manifest.json"))
          if len(env_paths) != 10:
              raise SystemExit(f"Expected 10 environments, got {len(env_paths)}")
          environments = [json.loads(path.read_text(encoding="utf-8")) for path in env_paths]
          if any(item.get("git", {}).get("dirty") is not False for item in environments):
              raise SystemExit("At least one shard environment is dirty")
          source_commits = {item.get("git", {}).get("commit") for item in environments}
          if len(source_commits) != 1:
              raise SystemExit(f"Shard source commits differ: {source_commits}")

          manifest = build_manifest(
              input_path=root / "input/targets.json",
              config={
                  "campaign": "tls_map_n10_v1",
                  "diagnostic_schema": report.get("schema_version"),
                  "target_ids": expected_ids,
              },
              seed=42,
              pipeline_version="0.3.0",
              environment_manifest_path=env_paths[0],
          )
          manifest.update({
              "campaign": "tls_map_n10_v1",
              "scope": "tls_map_radius_diagnostics_on_frozen_n10_real_tess_corpus",
              "source_shard_count": 10,
              "source_commit": next(iter(source_commits)),
              "target_ids": expected_ids,
              "aggregate_canonical_output_hash": canonical_hash(report),
              "shard_environment_hashes": {
                  path.parts[-3]: sha256_file(path) for path in env_paths
              },
          })
          manifest["artifacts"] = {
              str(path.relative_to(root)): sha256_file(path)
              for path in sorted(root.rglob("*"))
              if path.is_file() and path != root / "manifest.json"
          }
          (root / "manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Freeze measured diagnostic evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$CAMPAIGN_ROOT"
          git commit -m "validation: freeze clean N=10 radius diagnostics"
          git push origin HEAD:validation/tls-map-radius-n10-v1
