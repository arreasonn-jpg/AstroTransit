# Pre-commit hooks — hızlı yerel kalite kontrolleri.
# CI'daki kontrollerin bir kısmını commit öncesinde yakalar.
#
# Kapsam: simdilik sadece astrotransit/ cli/ dashboard/.
# tests/ ve scripts/ temizligi ayri PR'larda (chore/ruff-tests-scripts).
#
# Kurulum:
#   pip install -e ".[dev]"
#   pre-commit install
#
# Manuel calistirma:
#   pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        files: ^(astrotransit|cli|dashboard)/
      - id: end-of-file-fixer
        files: ^(astrotransit|cli|dashboard)/
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=5000]
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
        files: ^(astrotransit|cli|dashboard)/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
        files: ^(astrotransit|cli|dashboard)/

  - repo: local
    hooks:
      - id: mypy
        name: mypy (astrotransit cli dashboard)
        entry: mypy
        language: system
        args: [astrotransit, cli, dashboard]
        pass_filenames: false
        types: [python]
