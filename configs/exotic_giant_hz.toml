# AstroTransit — giant-star habitable-zone search configuration

[project]
name = "AstroTransit"
version = "0.3.0"

[modeling]
fit_method = "map"
mcmc_auto_upgrade = true

[modeling.mcmc]
mcmc_snr_threshold = 5.0

[tess]
author = "SPOC"
exptime = 120

[detection]
min_period = 1.0
max_period = 120.0
