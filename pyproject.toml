[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astrotransit"
version = "0.3.0"
description = "TESS verilerinden transit tespiti ve aday karakterizasyon platformu (JWST takip arayüzü)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    {name = "Esa Erdem"}
]

dependencies = [
    "astropy>=5.0",
    "astroquery>=0.4.6",
    "lightkurve>=2.4",
    "wotan>=1.9",
    "transitleastsquares",
    # PEP 632: std 'distutils' Python 3.12'de kaldırıldı; batman-package
    # (transitleastsquares bağımlılığı) import sırasında distutils kullanıyor.
    # setuptools, 3.12+ için distutils shim'i sağlıyor.
    "setuptools>=61; python_version >= '3.12'",
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "pyarrow>=12.0",
    "matplotlib>=3.7",
    "typer>=0.9",
    "rich>=13.0",
    "pydantic>=2.0",
    "tqdm>=4.65",
    "loguru>=0.7",
]

[project.optional-dependencies]
jwst = [
    "celerite2>=0.1.2",
]
dashboard = [
    "streamlit>=1.24",
    "plotly>=5.14",
]
modeling = [
    "pymc>=5.0",
    "arviz>=0.15",
    "batman-package",
    "exoplanet>=0.6",
    "exoplanet-core>=0.3",
]
dev = [
    "pytest>=7.0",
    "mypy>=1.10,<3",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "pre-commit>=3.5",
    "jsonschema>=4.20",
    "ipykernel>=6.0",
    "jupyterlab>=4.0",
    # CI quality job installs .[dev] only. The residual plot tests in
    # tests/test_visualization_report_generator.py exercise the transit
    # model, which requires batman at import time.
    "batman-package",
]

[project.scripts]
astrotransit = "cli.main:app"

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
where = ["."]
include = [
    "astrotransit",
    "astrotransit.*",
    "cli",
    "cli.*",
    "dashboard",
    "dashboard.*",
]
exclude = [
    "tests*",
    "notebooks*",
    "scripts*",
    "docs*",
    "benchmarks*",
    "outputs*",
    ".venv*",
    ".cache*",
]

[tool.ruff]
target-version = "py311"
line-length = 100

# scripts/archive/ ve scripts/patches/ donmus legacy koddur; aktif
# gelistirmede kullanilmaz. Ruff kapsami disinda tutulur ki
# mevcut hatalarini temizlemek icin zaman harcamayalim.
extend-exclude = [
    "scripts/archive",
    "scripts/patches",
]

[tool.ruff.lint]
# Repository-wide gate. Legacy style-only rules are progressively added
# via dedicated PRs; correctness rules remain mandatory.
#
# Kademeli genisleme:
#   - Bu PR: I (isort), W (warning), B (bugbear), SIM (simplify), RUF
#   - Gelecek: UP (pyupgrade), E501 refactor
#
# Turkce karakterler (RUF001/002/003) ve uzun satirlar (E501) bilincli olarak
# ignore edilir: docstring/yorumlar Turkce ve legacy satirlar refactor bekliyor.
select = ["E4", "E7", "E9", "F", "W", "I", "B", "SIM", "RUF"]
ignore = [
    "E501",      # line-too-long — legacy satirlar, ayri PR
    "RUF001",    # ambiguous unicode in string (Turkce karakterler)
    "RUF002",    # ambiguous unicode in docstring (Turkce)
    "RUF003",    # ambiguous unicode in comment (Turkce)
]

[tool.ruff.lint.per-file-ignores]
# Typer CLI'da "typer.Option(...)" fonksiyon cagrisi default arg olarak
# kullanilir - bu Typer'in resmi tasarimidir, B008 false positive.
"cli/main.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: agir simulasyon testleri (>10s). Normalde hepsi calisir;",
    "      hizli yerel gelistirme icin -m 'not slow' kullanilabilir.",
]

[tool.mypy]
python_version = "3.11"
show_error_codes = true
pretty = true
ignore_missing_imports = true
# Cross-version mypy farkini tolere etmek icin esnetildi.
# Ayni cast bazi surumlerde gerekli, bazilarinda redundant gorunebiliyor.
warn_redundant_casts = false
warn_unused_ignores = true
warn_unused_configs = true
no_implicit_optional = true
warn_return_any = true
strict_equality = true

exclude = [
    '^build/',
    '^dist/',
    '^\.venv/',
    '^notebooks/',
    '^scripts/',
    '^release/',
]

# Kademeli sıkılaştırma planı (Faz 2):
# - Modül gruplarına göre disallow_untyped_defs
# - disallow_any_generics / disallow_untyped_calls
# Bu taban yapılandırma, CI'da bilgilendirici olarak çalışır.

[tool.coverage.run]
branch = true
source = ["astrotransit", "cli", "dashboard"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
# Kademeli artis: 48 -> 52 -> 55 -> 60 -> 70 -> 72 (mevcut %73.74).
# test/coverage-boost-1: 4 quality modulu %0 -> %98.
# test/coverage-boost-2: 7 visualization modulu %10-40 -> %93-100.
# test/coverage-boost-3: logging_config, quality/pipeline, quality/metrics,
#                        transit_consistency; ayrıca timing_analysis ep_obs bug fix.
# test/coverage-boost-4: validation/plots, data/temp_cache,
#                        preprocessing/pipeline, pipelines/orchestrator.
fail_under = 72
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
]
