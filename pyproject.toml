[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astrotransit"
version = "0.3.0"
description = "TESS verilerinden transit tespiti ve aday karakterizasyon platformu (JWST takip arayüzü)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    {name = "AstroTransit Team"}
]

dependencies = [
    "astropy>=5.0",
    "astroquery>=0.4.6",
    "lightkurve>=2.4",
    "boto3>=1.26",
    "wotan>=1.9",
    "transitleastsquares",
    # PEP 632: std 'distutils' Python 3.12'de kaldırıldı; batman-package
    # (transitleastsquares bağımlılığı) import sırasında distutils kullanıyor.
    # setuptools, 3.12+ için distutils shim'i sağlıyor.
    "setuptools>=61; python_version >= '3.12'",
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "pyarrow>=12.0",
    "matplotlib>=3.7",
    "plotly>=5.14",
    "typer>=0.9",
    "rich>=13.0",
    "streamlit>=1.24",
    "pydantic>=2.0",
    "tqdm>=4.65",
    "loguru>=0.7",
]

[project.optional-dependencies]
jwst = [
    "celerite2>=0.1.2",
]
modeling = [
    "pymc>=5.0",
    "arviz>=0.15",
    "batman-package",
    "exoplanet>=0.6",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "jsonschema>=4.20",
    "ipykernel>=6.0",
    "jupyterlab>=4.0",
]

[project.scripts]
astrotransit = "cli.main:app"

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
where = ["."]
include = [
    "astrotransit",
    "astrotransit.*",
    "cli",
    "cli.*",
    "dashboard",
    "dashboard.*",
]
exclude = [
    "tests*",
    "notebooks*",
    "scripts*",
    "docs*",
    "benchmarks*",
    "outputs*",
    ".venv*",
    ".cache*",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]