[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astrotransit"
version = "0.3.0"
description = "TESS verilerinden transit tespiti ve aday karakterizasyon platformu (JWST takip arayüzü)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    {name = "Esa Erdem"}
]

dependencies = [
    "astropy>=5.0",
    "astroquery>=0.4.6",
    "lightkurve>=2.4",
    "boto3>=1.26",
    "wotan>=1.9",
    "transitleastsquares",
    # PEP 632: std 'distutils' Python 3.12'de kaldırıldı; batman-package
    # (transitleastsquares bağımlılığı) import sırasında distutils kullanıyor.
    # setuptools, 3.12+ için distutils shim'i sağlıyor.
    "setuptools>=61; python_version >= '3.12'",
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "pyarrow>=12.0",
    "matplotlib>=3.7",
    "plotly>=5.14",
    "typer>=0.9",
    "rich>=13.0",
    "streamlit>=1.24",
    "pydantic>=2.0",
    "tqdm>=4.65",
    "loguru>=0.7",
]

[project.optional-dependencies]
jwst = [
    "celerite2>=0.1.2",
]
modeling = [
    "pymc>=5.0",
    "arviz>=0.15",
    "batman-package",
    "exoplanet>=0.6",
    "exoplanet-core>=0.3",
]
dev = [
    "pytest>=7.0",
    "mypy>=1.10,<3",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "jsonschema>=4.20",
    "ipykernel>=6.0",
    "jupyterlab>=4.0",
]

[project.scripts]
astrotransit = "cli.main:app"

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
where = ["."]
include = [
    "astrotransit",
    "astrotransit.*",
    "cli",
    "cli.*",
    "dashboard",
    "dashboard.*",
]
exclude = [
    "tests*",
    "notebooks*",
    "scripts*",
    "docs*",
    "benchmarks*",
    "outputs*",
    ".venv*",
    ".cache*",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Repository-wide gate. Legacy style-only rules (imports, preview upgrades) are
# intentionally not release blockers; correctness rules remain mandatory.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
show_error_codes = true
pretty = true
ignore_missing_imports = true
# Cross-version mypy farkini tolere etmek icin esnetildi.
# Ayni cast bazi surumlerde gerekli, bazilarinda redundant gorunebiliyor.
warn_redundant_casts = false
warn_unused_ignores = true
warn_unused_configs = true
no_implicit_optional = true
warn_return_any = true
strict_equality = true

exclude = [
    '^build/',
    '^dist/',
    '^\.venv/',
    '^notebooks/',
    '^scripts/',
    '^release/',
]

# Kademeli sıkılaştırma planı (Faz 2):
# - Modül gruplarına göre disallow_untyped_defs
# - disallow_any_generics / disallow_untyped_calls
# Bu taban yapılandırma, CI'da bilgilendirici olarak çalışır.

[tool.coverage.run]
branch = true
source = ["astrotransit", "cli", "dashboard"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
# Faz 1 tabanı: 2026-10 baseline %49.25 (branch=true).
# Kademeli artış planı: her kapsam PR'ı sonrası +2 puan.
fail_under = 48
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
]
